<title>Shelfmark</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --paper:#F2F4EF;
  --paper-raised:#FFFFFF;
  --paper-sunken:#E7EAE3;
  --ink:#1B2420;
  --ink-muted:#5B665F;
  --ink-faint:#8A948C;
  --line:#D6DACF;
  --accent:#0F6D5C;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3EFE9;
  --tag:#D98A2B;
  --tag-ink:#241804;
  --tag-soft:#F7E7CC;
  --danger:#B3432B;
  --danger-soft:#F6E1DA;
  --success:#2F7A4F;
  --shadow:rgba(27,36,32,0.10);
  --radius:12px;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161B18;
    --paper-raised:#1F2622;
    --paper-sunken:#101412;
    --ink:#EAEFE9;
    --ink-muted:#9CAA9F;
    --ink-faint:#6B776E;
    --line:#2B342E;
    --accent:#3FBFA0;
    --accent-ink:#062420;
    --accent-soft:#1D3830;
    --tag:#F0B65B;
    --tag-ink:#241800;
    --tag-soft:#3A2C11;
    --danger:#E58267;
    --danger-soft:#3A2019;
    --success:#6FCB93;
    --shadow:rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --paper:#161B18;
  --paper-raised:#1F2622;
  --paper-sunken:#101412;
  --ink:#EAEFE9;
  --ink-muted:#9CAA9F;
  --ink-faint:#6B776E;
  --line:#2B342E;
  --accent:#3FBFA0;
  --accent-ink:#062420;
  --accent-soft:#1D3830;
  --tag:#F0B65B;
  --tag-ink:#241800;
  --tag-soft:#3A2C11;
  --danger:#E58267;
  --danger-soft:#3A2019;
  --success:#6FCB93;
  --shadow:rgba(0,0,0,0.45);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
button{font-family:inherit;}
::selection{background:var(--tag-soft); color:var(--ink);}
a{color:var(--accent);}

.app{max-width:1180px; margin:0 auto; padding:28px 20px 80px;}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin-bottom:28px; padding-bottom:16px; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:17px;
  flex:none;
}
.brand-name{font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:.2px;}
.brand-sub{font-size:12px; color:var(--ink-muted); font-family:var(--font-mono);}
.topbar-actions{display:flex; gap:8px; align-items:center;}

.icon-btn{
  border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-muted);
  border-radius:8px; padding:7px 11px; font-size:12px; cursor:pointer; font-family:var(--font-mono);
}
.icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}

/* ---------- Home ---------- */
.home-hero{
  display:grid; grid-template-columns:1.1fr .9fr; gap:32px; align-items:center;
  padding:44px 8px 40px;
}
@media (max-width:820px){ .home-hero{grid-template-columns:1fr;} }
.home-eyebrow{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent); margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.home-eyebrow::before{content:""; width:16px; height:1px; background:var(--accent); display:inline-block;}
.home-hero h1{font-size:42px; font-weight:600; margin-bottom:14px;}
.home-hero p{color:var(--ink-muted); font-size:16px; max-width:52ch; margin-bottom:26px;}

.btn{
  border:none; cursor:pointer; border-radius:9px; font-weight:600; font-family:var(--font-body);
  padding:13px 22px; font-size:15px; display:inline-flex; align-items:center; gap:8px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-faint);}
.btn-tag{background:var(--tag); color:var(--tag-ink);}
.btn-danger-outline{background:transparent; border:1px solid var(--danger); color:var(--danger);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:7px;}

.create-ticket{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:16px;
  padding:30px 26px; box-shadow:0 10px 30px var(--shadow); position:relative;
}
.create-ticket::before{
  content:""; position:absolute; left:-9px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; border-radius:50%; background:var(--paper); border:1px solid var(--line);
}
.create-ticket::after{
  content:""; position:absolute; right:-9px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; border-radius:50%; background:var(--paper); border:1px solid var(--line);
}
.ticket-row{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:16px;}
.create-ticket h2{font-size:22px; margin-bottom:8px;}
.create-ticket p{color:var(--ink-muted); font-size:14px; margin-bottom:20px;}
.ticket-steps{list-style:none; margin:0 0 22px; padding:0; display:flex; flex-direction:column; gap:9px;}
.ticket-steps li{display:flex; gap:10px; font-size:13.5px; color:var(--ink-muted); align-items:flex-start;}
.ticket-steps li b{color:var(--ink); font-weight:600;}
.ticket-steps .num{
  font-family:var(--font-mono); font-size:11px; color:var(--accent); border:1px solid var(--accent-soft);
  background:var(--accent-soft); border-radius:5px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex:none;
}

.drafts-section{margin-top:8px;}
.drafts-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;}
.drafts-head h3{font-size:14px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-weight:500;}
.drafts-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
.draft-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:11px; padding:16px;
  cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:6px; position:relative;
}
.draft-card:hover{border-color:var(--accent);}
.draft-card .stub{font-family:var(--font-mono); font-size:10px; color:var(--tag); text-transform:uppercase; letter-spacing:.06em;}
.draft-card .title{font-weight:600; font-size:15px;}
.draft-card .meta{font-size:12px; color:var(--ink-faint);}
.draft-card .del{position:absolute; top:10px; right:10px; background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px;}
.draft-card .del:hover{color:var(--danger);}
.empty-note{color:var(--ink-faint); font-size:13.5px; font-style:italic;}

/* ---------- Wizard shell ---------- */
.wizard{display:grid; grid-template-columns:220px 1fr; gap:0; background:var(--paper-raised); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 10px 30px var(--shadow);}
@media (max-width:760px){ .wizard{grid-template-columns:1fr;} .rail{display:none;} }

.rail{background:var(--paper-sunken); border-right:1px solid var(--line); padding:22px 16px;}
.rail-title{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin-bottom:16px;}
.rail-steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px;}
.rail-step{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13px; color:var(--ink-faint);}
.rail-step.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.rail-step.done{color:var(--ink-muted);}
.rail-dot{width:7px; height:7px; border-radius:50%; background:var(--line); flex:none;}
.rail-step.active .rail-dot{background:var(--accent);}
.rail-step.done .rail-dot{background:var(--success);}

.panel{padding:34px 38px; min-height:460px; display:flex; flex-direction:column;}
@media (max-width:600px){ .panel{padding:22px 18px;} }
.panel-head{margin-bottom:22px;}
.panel-eyebrow{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--tag); margin-bottom:8px;}
.panel-head h2{font-size:25px; margin-bottom:8px;}
.panel-head p{color:var(--ink-muted); font-size:14.5px; max-width:64ch;}
.panel-body{flex:1;}
.panel-foot{display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:20px; border-top:1px solid var(--line);}

label.field{display:block; margin-bottom:20px;}
label.field .lbl{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:600; margin-bottom:7px;}
label.field .lbl .skip{font-weight:400; font-size:12px; color:var(--ink-faint); font-family:var(--font-mono);}
input[type=text], textarea{
  width:100%; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:8px;
  padding:11px 13px; font-family:var(--font-body); font-size:14.5px; resize:vertical;
}
input[type=text]:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
textarea{min-height:110px;}
.hint{font-size:12.5px; color:var(--ink-faint); margin-top:6px;}

.opt-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
.opt-card{
  border:1.5px solid var(--line); border-radius:10px; padding:14px; cursor:pointer; background:var(--paper);
  position:relative; transition:border-color .1s;
}
.opt-card:hover{border-color:var(--ink-faint);}
.opt-card.selected{border-color:var(--accent); background:var(--accent-soft);}
.opt-card .rec{
  position:absolute; top:-9px; right:10px; background:var(--tag); color:var(--tag-ink); font-size:10px;
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:5px; font-weight:600;
}
.opt-card .t{font-weight:700; font-size:15px; margin-bottom:4px;}
.opt-card .d{font-size:12.5px; color:var(--ink-muted); margin-bottom:8px;}
.opt-card .cost{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); display:flex; gap:4px; align-items:center;}
.opt-card.selected .cost{color:var(--accent);}

.upload-zone{
  border:1.5px dashed var(--line); border-radius:12px; padding:30px; text-align:center; cursor:pointer; background:var(--paper);
}
.upload-zone:hover{border-color:var(--accent);}
.upload-zone.drag{border-color:var(--accent); background:var(--accent-soft);}
.upload-zone .u-icon{font-size:26px; margin-bottom:8px;}
.upload-zone .u-title{font-weight:600; font-size:14.5px; margin-bottom:4px;}
.upload-zone .u-sub{font-size:12.5px; color:var(--ink-faint);}

.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin-top:16px;}
.thumb{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper); position:relative;}
.thumb img{width:100%; height:110px; object-fit:cover; display:block; background:var(--paper-sunken);}
.thumb .role{padding:7px 9px;}
.thumb select{width:100%; font-size:11.5px; border:1px solid var(--line); border-radius:6px; padding:4px 5px; background:var(--paper-raised); color:var(--ink); font-family:var(--font-mono);}
.thumb .rm{position:absolute; top:6px; right:6px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:12px; line-height:1;}
.thumb .idx{position:absolute; top:6px; left:6px; background:rgba(0,0,0,.55); color:#fff; font-family:var(--font-mono); font-size:10px; padding:2px 6px; border-radius:5px;}

.think-box{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:60px 20px; text-align:center;
}
.spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.think-box .msg{font-family:var(--font-mono); font-size:13px; color:var(--ink-muted);}
.think-box .stream{max-width:60ch; font-size:13px; color:var(--ink-faint); white-space:pre-wrap;}

.concept-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px;}
.concept-card{
  border:1.5px solid var(--line); border-radius:12px; padding:18px; cursor:pointer; background:var(--paper); display:flex; flex-direction:column; gap:10px; position:relative;
}
.concept-card:hover{border-color:var(--ink-faint);}
.concept-card.selected{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent);}
.concept-card .badge{
  position:absolute; top:-9px; left:14px; background:var(--tag); color:var(--tag-ink); font-size:10px; font-family:var(--font-mono);
  text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:5px; font-weight:600;
}
.concept-card h4{font-size:16.5px; font-family:var(--font-display); font-weight:600;}
.concept-card .pitch{font-size:13px; color:var(--ink-muted);}
.concept-flow{display:flex; flex-wrap:wrap; gap:5px; margin-top:2px;}
.flow-chip{font-family:var(--font-mono); font-size:10.5px; background:var(--paper-sunken); color:var(--ink-muted); padding:3px 8px; border-radius:20px;}
.concept-card.selected .flow-chip{background:var(--paper-raised);}
.concept-card .why{font-size:12px; color:var(--ink-faint); border-top:1px dashed var(--line); padding-top:9px; margin-top:2px;}

/* ---------- Preview ---------- */
.preview-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.device-tabs{display:flex; gap:4px; background:var(--paper-sunken); padding:4px; border-radius:9px;}
.device-tabs button{border:none; background:none; padding:7px 14px; border-radius:6px; font-size:13px; font-weight:600; color:var(--ink-muted); cursor:pointer; font-family:var(--font-mono);}
.device-tabs button.active{background:var(--paper-raised); color:var(--ink); box-shadow:0 1px 3px var(--shadow);}

.device-stage{background:var(--paper-sunken); border-radius:14px; padding:26px; display:flex; justify-content:center; overflow-x:auto;}
.device-frame{background:#fff; color:#15201b; box-shadow:0 12px 30px var(--shadow); border-radius:4px; overflow:hidden;}
.device-frame.desktop{width:970px; max-width:100%;}
.device-frame.mobile{width:380px;}

.mod{padding:26px 30px; border-bottom:1px solid #ECEFE9;}
.device-frame.mobile .mod{padding:18px 16px;}
.mod:last-child{border-bottom:none;}
.mod-eyebrow{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:#8A9A8F; margin-bottom:8px;}
.mod h3{font-family:var(--font-display); font-size:24px; color:#141C18; margin-bottom:8px;}
.device-frame.mobile .mod h3{font-size:19px;}
.mod .sub{font-size:14.5px; color:#4C5A52; margin-bottom:12px; font-weight:500;}
.mod .body-txt{font-size:14px; color:#33403A; margin-bottom:10px; max-width:60ch;}
.mod-media{width:100%; border-radius:6px; overflow:hidden; margin-bottom:14px; background:#EEF0EA;}
.mod-media img{width:100%; display:block; object-fit:cover; max-height:340px;}
.mod-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:center;}
.device-frame.mobile .mod-grid{grid-template-columns:1fr;}
.mod ul.bullets{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px;}
.mod ul.bullets li{display:flex; gap:9px; font-size:13.5px; color:#33403A;}
.mod ul.bullets li::before{content:"✓"; color:#0F6D5C; font-weight:700; flex:none;}
.mod-compare table{width:100%; border-collapse:collapse; font-size:12.5px;}
.mod-compare th,.mod-compare td{border:1px solid #E1E5DC; padding:8px 10px; text-align:left;}
.mod-compare th{background:#F3F5EF; font-family:var(--font-mono); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:.04em;}
.mod-faq .qa{margin-bottom:12px;}
.mod-faq .q{font-weight:600; font-size:13.5px; margin-bottom:3px;}
.mod-faq .a{font-size:13px; color:#4C5A52;}
.mod-box ul{padding-left:18px; margin:0; font-size:13.5px; color:#33403A;}
.mobile-note{font-family:var(--font-mono); font-size:10px; color:#9AA69F; margin-top:10px; border-top:1px dashed #E1E5DC; padding-top:8px;}

.export-bar{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px;}
.spec-note{background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:14px 16px; font-size:13px; color:var(--ink); margin-bottom:18px;}
.spec-note b{color:var(--accent);}

.feedback-box{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:20px;}
.feedback-box h4{font-size:14px; margin-bottom:10px;}
.mod-picker{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.mod-pill{border:1px solid var(--line); background:var(--paper-raised); border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer; color:var(--ink-muted);}
.mod-pill.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
  padding:11px 18px; border-radius:8px; font-size:13.5px; box-shadow:0 6px 20px var(--shadow); z-index:50;
  max-width:min(90vw,480px); text-align:center;
}
[data-theme="dark"] .toast, .toast{background:var(--ink); color:var(--paper);}

.error-banner{background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); border-radius:9px; padding:12px 14px; font-size:13px; margin-bottom:16px;}

.check-list{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
.check-row{display:flex; gap:10px; align-items:flex-start; font-size:14px; cursor:pointer; border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:var(--paper);}
.check-row input{margin-top:3px; flex:none;}
.add-row{display:flex; gap:8px; margin-top:14px;}
.add-row input{flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:var(--paper); color:var(--ink); font-family:inherit; font-size:13.5px;}

.style-tabs{display:flex; gap:4px; background:var(--paper-sunken); padding:4px; border-radius:9px; flex-wrap:wrap;}
.style-tabs button{border:none; background:none; padding:7px 13px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; font-family:var(--font-mono);}
.style-tabs button.active{background:var(--paper-raised); color:var(--accent); box-shadow:0 1px 3px var(--shadow);}
.privacy-note{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; margin-top:10px;}

.phone-chrome{background:#0F1412; border-radius:34px; padding:14px 10px; box-shadow:0 16px 40px var(--shadow);}
.phone-chrome .notch{width:90px; height:16px; background:#0F1412; border-radius:0 0 12px 12px; margin:0 auto 6px; position:relative; z-index:2;}
.phone-chrome .device-frame{border-radius:20px; box-shadow:none;}

.mod-card-wrap{padding:22px; display:flex; flex-direction:column; gap:18px;}
.device-frame.mobile .mod-card-wrap{padding:14px; gap:14px;}
.mod-card{border-radius:14px; overflow:hidden; position:relative; box-shadow:0 6px 18px rgba(0,0,0,.12);}
.mod-card .mod{border-bottom:none; padding:26px 28px;}
.device-frame.mobile .mod-card .mod{padding:18px 16px;}
.mod-card .tagno{
  position:absolute; top:14px; left:14px; font-family:var(--font-mono); font-size:11px; font-weight:600;
  background:rgba(20,28,24,.55); color:#fff; padding:3px 9px; border-radius:20px; letter-spacing:.03em; z-index:2;
}
.tint-0{background:#EFF3EC;} .tint-1{background:#FFF7EA;} .tint-2{background:#EAF1F5;} .tint-3{background:#F3EEF6;} .tint-4{background:#FFFFFF;}

.bento-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:22px;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<div class="app" id="app"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* ============================= HOUSE STYLE / CONTENT RULES ============================= */
const RULES = [
"AMAZON A+ CONTENT HOUSE STYLE — follow exactly:",
"- Write A+ Content modules for Amazon Brand Registry sellers, optimized to read well on BOTH desktop and mobile.",
"- Every module leads with a customer BENEFIT translated from the underlying feature — never a bare spec dump.",
"- Overview-style copy stays under ~100 words; bullets are under ~18 words each; short lines that don't wall-of-text on mobile.",
"- Tone: confident, concise, active voice, plain language. No hype-stacking, no more than one exclamation point per module, no emoji in body copy.",
"- NEVER invent customer reviews, star ratings, testimonials, or quotes attributed to a person — that is fabrication and against policy.",
"- NEVER name or reference a competitor brand. A comparison module compares 'This product' to a generic 'Typical alternatives' column only, and only states this product's real advantages — never invents numbers, never disparages.",
"- NEVER use ©, ®, or ™ symbols, NEVER include external links or mention of other websites, NEVER promise guarantees/warranties beyond what the seller stated, NEVER invent certifications, awards, or statistics not given to you.",
"- If information is missing, write plausible, conservative, generic-but-true copy consistent with the description — do not invent specific numbers, materials, or claims you were not given."
].join("\n");

/* ============================= STATE ============================= */
const LS_KEY = "shelfmark.drafts.v1";
let sampleApi = null, sampleLimits = null, downloadsApi = null;
let toastTimer = null;

function loadDrafts(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }catch(e){ return []; }
}
function saveDrafts(list){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); }catch(e){}
}
function persistCurrent(){
  if(!S.id) return;
  const list = loadDrafts();
  const idx = list.findIndex(d => d.id === S.id);
  const record = {
    id: S.id, updatedAt: Date.now(), name: S.name, brand: S.brand,
    description: S.description, features: S.features, featuresSkipped: S.featuresSkipped,
    featureCandidates: S.featureCandidates, step: S.step,
    imagesToUse: S.imagesToUse, visionCount: S.visionCount, depth: S.depth, style: S.style,
    concepts: S.concepts, conceptId: S.conceptId, modules: S.modules,
    imageMeta: S.images.map(im => ({role: im.role, name: im.name}))
  };
  if(idx >= 0) list[idx] = record; else list.unshift(record);
  saveDrafts(list.slice(0, 20));
}
function deleteDraft(id){
  saveDrafts(loadDrafts().filter(d => d.id !== id));
}

function newState(){
  return {
    id: null, step: "home",
    name: "", brand: "", description: "", features: "", featuresSkipped:false,
    featureCandidates: [], // {text, approved}
    images: [], // {name, dataUrl, blob, role}
    imagesToUse: 4, visionCount: 2, depth: "standard",
    concepts: null, conceptId: null, modules: null,
    style: "cards", previewDevice: "desktop",
    generating:false, genMsg:"", genStream:"",
    feedbackText:"", feedbackTargets: [], // module types or "all"
    error:null
  };
}
let S = newState();

const ROLE_OPTS = [
  ["hero","Hero / main shot"],
  ["lifestyle","Lifestyle / in-use"],
  ["feature","Feature close-up"],
  ["comparison","Comparison / angle"],
  ["box","Contents / accessories"],
  ["other","Other"]
];
const ROLE_DEFAULTS = ["hero","lifestyle","feature","box","comparison"];

const DEPTHS = {
  minimal:  {label:"Minimal",       modules:3, tier:"default", desc:"Hero + one feature module + CTA. Fastest, cheapest generation."},
  standard: {label:"Standard",      modules:5, tier:"default", desc:"Adds a problem/solution and use-case module. Best balance."},
  comprehensive:{label:"Comprehensive", modules:7, tier:"complex", desc:"Adds a comparison chart and FAQ. Most thorough, slowest & priciest call."}
};

const STYLES = {
  cards:    {label:"Broken Cards",    desc:"Each module its own standalone tile — matches how Amazon ingests one image per module."},
  flow:     {label:"Smooth Flow",     desc:"One continuous scrolling page — classic storytelling layout."},
  bento:    {label:"Bento Grid",      desc:"Every module tiled into one at-a-glance dashboard."},
  callouts: {label:"Numbered Callouts", desc:"Feature bullets get numbered badges, echoed near the product photo."}
};
const CALLOUT_POS = [{top:"8%",left:"6%"},{top:"12%",left:"78%"},{top:"70%",left:"8%"},{top:"66%",left:"74%"},{top:"42%",left:"42%"}];

function toast(msg){
  const host = document.getElementById("toastHost");
  host.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ host.innerHTML=""; }, 3200);
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

/* ============================= CAPABILITIES ============================= */
async function initCapabilities(){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      sampleApi = await window.claude.use("sample");
      downloadsApi = await window.claude.use("downloads");
      if(sampleApi){
        try{ sampleLimits = await sampleApi.limits(); }catch(e){ sampleLimits = null; }
      }
    }
  }catch(e){ sampleApi = null; downloadsApi = null; }
  render();
}

/* ============================= IMAGE HANDLING ============================= */
function resizeImage(file, maxDim){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width:w, height:h} = img;
      if(w > maxDim || h > maxDim){
        if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{
        const reader = new FileReader();
        reader.onload = ()=> resolve({blob, dataUrl: reader.result});
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      }, "image/jpeg", 0.86);
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function handleFiles(fileList){
  const files = Array.from(fileList).filter(f => /^image\//.test(f.type));
  const room = 5 - S.images.length;
  if(room <= 0){ toast("You already have 5 photos — remove one first."); return; }
  const toAdd = files.slice(0, room);
  for(const f of toAdd){
    try{
      const {blob, dataUrl} = await resizeImage(f, 1400);
      const role = ROLE_DEFAULTS[S.images.length] || "other";
      S.images.push({name:f.name, dataUrl, blob, role});
    }catch(e){ /* skip unreadable file */ }
  }
  if(S.imagesToUse < S.images.length) S.imagesToUse = Math.min(5, S.images.length);
  if(S.images.length && S.imagesToUse === 4 && S.images.length < 4) S.imagesToUse = S.images.length;
  render();
}

/* ============================= PROMPT BUILDERS ============================= */
function approvedFeaturesText(){
  const approved = (S.featureCandidates||[]).filter(c=>c.approved).map(c=>c.text);
  return approved.join("\n");
}
function buildCandidatesFromTyped(text){
  return text.split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({text:t, approved:true}));
}
async function generateFeatureCandidates(){
  S.featuresSkipped = true;
  if(!sampleApi){
    S.featureCandidates = [];
    goto("features-review");
    return;
  }
  S.step="generating"; S.generating=true; S.genMsg="Drafting feature suggestions from your description…"; S.genStream=""; S.error=null;
  render();
  const prompt = [
    RULES, "",
    "PRODUCT NAME: " + S.name, "BRAND: " + (S.brand||"(unbranded)"), "DESCRIPTION: " + S.description, "",
    "TASK",
    "Draft 6 to 8 short, plausible, conservative feature/benefit phrases (each under 10 words) strictly inferable from the description above. Do not invent specific numbers, certifications, or materials the description doesn't imply.",
    "", "Reply with ONLY a JSON array of strings."
  ].join("\n");
  try{
    const data = await sampleApi.json(prompt, {modelTier:"quick", cache:false});
    const list = Array.isArray(data) ? data.filter(x=>typeof x==="string" && x.trim()) : [];
    S.featureCandidates = list.map(t=>({text:t.trim(), approved:true}));
  }catch(e){
    S.featureCandidates = [];
    S.error = sampleErrorCopy(e);
  }
  S.generating=false; S.step="features-review"; persistCurrent(); render();
}

function productBlock(){
  return [
    "PRODUCT",
    "Name: " + S.name,
    "Brand: " + (S.brand || "(unbranded — refer to it generically as 'the brand')"),
    "Description (from seller): " + S.description,
    "Features/benefits the seller approved for use: " + (approvedFeaturesText() || "(none approved — infer a short, conservative, plausible feature set strictly from the description above; do not invent specific numbers or materials)")
  ].join("\n");
}
function imageBlock(){
  const used = S.images.slice(0, S.imagesToUse);
  return "IMAGES AVAILABLE (assign modules to these by index; -1 if none fits):\n" +
    used.map((im,i)=> i+": "+ROLE_OPTS.find(r=>r[0]===im.role)[1]).join("\n");
}
function pickVisionImages(){
  if(!sampleLimits || !sampleLimits.images) return undefined;
  const n = Math.min(S.visionCount, S.images.length, sampleLimits.images.maxCount||3);
  if(n <= 0) return undefined;
  return S.images.slice(0,n).map(im=>im.blob);
}

async function generateConcepts(){
  if(!sampleApi){ S.error = "AI generation isn't available in this view."; render(); return; }
  S.step = "generating"; S.generating = true; S.genMsg = "Sketching 3 design concepts…"; S.genStream=""; S.error=null;
  render();
  const depth = DEPTHS[S.depth];
  const prompt = [
    RULES, "",
    productBlock(), "",
    imageBlock(), "",
    "Design depth target: " + depth.label + " (~" + depth.modules + " modules).", "",
    "TASK",
    "Propose exactly 3 distinct Amazon A+ Content design concepts for this product — each a genuinely different strategic angle (for example: benefit-led, lifestyle/story-led, spec-and-trust-led), not cosmetic variants of the same idea.",
    "Each concept's moduleFlow must contain exactly " + depth.modules + " modules, in display order, using ONLY these types: hero, problem_solution, feature_bullets, use_cases, comparison, faq, whats_in_box, brand_story. Always start with \"hero\". Only include \"comparison\" or \"faq\" for Standard/Comprehensive depth.",
    "", "Reply with ONLY a JSON array of exactly 3 objects, no other text:",
    '[{"id":"a","name":"3-5 word concept name","pitch":"one sentence selling the angle","moduleFlow":[{"type":"hero","label":"short human label"}, ...],"recommended":true,"why":"one sentence why this fits this specific product"}, ...]'
  ].join("\n");
  try{
    const images = pickVisionImages();
    const data = await sampleApi.json(prompt, {modelTier:"default", cache:false, images,
      onText:(u)=>{ S.genStream = u.text.slice(-400); render(); }});
    if(!Array.isArray(data) || data.length < 1) throw {code:"invalid_json"};
    S.concepts = data.slice(0,3);
    S.generating = false; S.step = "concepts";
    persistCurrent(); render();
  }catch(e){
    S.generating = false; S.step = "usage";
    S.error = sampleErrorCopy(e);
    render();
  }
}

async function generateFullContent(){
  if(!sampleApi || !S.conceptId){ return; }
  const concept = S.concepts.find(c=>c.id===S.conceptId);
  S.step = "generating"; S.generating = true; S.genMsg = "Writing full module copy for “"+concept.name+"”…"; S.genStream=""; S.error=null;
  render();
  const depth = DEPTHS[S.depth];
  const prompt = [
    RULES, "",
    productBlock(), "",
    imageBlock(), "",
    "CHOSEN CONCEPT: " + concept.name + " — " + concept.pitch,
    "MODULE FLOW (write these, in this order): " + JSON.stringify(concept.moduleFlow), "",
    "TASK",
    "Write the complete A+ Content for every module in MODULE FLOW.",
    "For each module return an object:",
    '{"type":"...", "headline":"...", "subheadline":"... or empty string", "body":"short paragraph or empty string", "bullets":["...", ...] (empty array if not applicable), "faq":[{"q":"...","a":"..."}] (only for type faq, else []), "compareRows":[{"label":"...","this":"...","typical":"..."}] (only for type comparison, else []), "imageIndex": integer index into the IMAGES AVAILABLE list this module should use, or -1, "mobileNote":"one short note on how this reads on mobile"}',
    "", 'Reply with ONLY a JSON object: {"modules":[ ... ]}'
  ].join("\n");
  try{
    const images = pickVisionImages();
    const data = await sampleApi.json(prompt, {modelTier:depth.tier, cache:false, images,
      onText:(u)=>{ S.genStream = u.text.slice(-400); render(); }});
    if(!data || !Array.isArray(data.modules) || !data.modules.length) throw {code:"invalid_json"};
    S.modules = data.modules;
    S.generating = false; S.step = "preview";
    persistCurrent(); render();
  }catch(e){
    S.generating = false; S.step = "concepts";
    S.error = sampleErrorCopy(e);
    render();
  }
}

async function applyFeedback(){
  if(!sampleApi || !S.modules) return;
  const feedback = S.feedbackText.trim();
  if(!feedback){ toast("Describe what's wrong first."); return; }
  const targets = S.feedbackTargets.length ? S.feedbackTargets : ["ALL"];
  S.step = "generating"; S.generating = true; S.genMsg = "Applying your fix…"; S.genStream=""; S.error=null;
  render();
  const prompt = [
    RULES, "",
    productBlock(), "",
    imageBlock(), "",
    "CURRENT MODULES (JSON): " + JSON.stringify(S.modules), "",
    "SELLER FEEDBACK: \"" + feedback + "\"",
    "TARGET MODULE TYPES TO REVISE: " + JSON.stringify(targets) + ' ("ALL" means every module).',
    "", "TASK",
    "Rewrite ONLY the targeted modules to address the feedback; return every module (targeted ones revised, others unchanged, same order, same JSON shape as CURRENT MODULES).",
    "", 'Reply with ONLY a JSON object: {"modules":[ ... ]}'
  ].join("\n");
  try{
    const data = await sampleApi.json(prompt, {modelTier:"default", cache:false,
      onText:(u)=>{ S.genStream = u.text.slice(-400); render(); }});
    if(!data || !Array.isArray(data.modules) || !data.modules.length) throw {code:"invalid_json"};
    S.modules = data.modules;
    S.feedbackText = ""; S.feedbackTargets = [];
    S.generating = false; S.step = "preview";
    persistCurrent(); render();
    toast("Updated.");
  }catch(e){
    S.generating = false; S.step = "preview";
    S.error = sampleErrorCopy(e);
    render();
  }
}

function sampleErrorCopy(e){
  const code = e && e.code;
  const map = {
    not_granted: "You declined AI access for this page, so generation is unavailable this visit — reload to be asked again.",
    sampling_disabled: "AI generation isn't enabled for this account.",
    rate_limited: "Too many requests right now — wait a moment and try again.",
    invalid_json: "The AI's reply couldn't be read as content — please try again.",
    refused: "The request was declined — try adjusting the description or feedback text.",
    empty_completion: "No content came back — try again, maybe with a shorter description.",
    prompt_too_large: "Your inputs are too long — please shorten the description or features.",
    upstream_error: "A temporary service hiccup — please try again."
  };
  return (map[code]) || "Something went wrong generating content. You can try again.";
}

/* ============================= EXPORT ============================= */
function slug(s){ return (s||"aplus-content").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,40) || "aplus-content"; }

function moduleTitle(type){
  return {hero:"Hero", problem_solution:"Problem → Solution", feature_bullets:"Features & Benefits",
    use_cases:"Use Cases", comparison:"Comparison", faq:"FAQ", whats_in_box:"What's In The Box", brand_story:"Brand Story"}[type] || type;
}

function buildExportHtml(){
  const rows = (S.modules||[]).map((m,i)=>{
    const img = (m.imageIndex>=0 && S.images[m.imageIndex]) ? S.images[m.imageIndex].dataUrl : "";
    let extra = "";
    if(m.bullets && m.bullets.length) extra += "<ul>"+m.bullets.map(b=>"<li>"+escapeHtml(b)+"</li>").join("")+"</ul>";
    if(m.faq && m.faq.length) extra += m.faq.map(f=>"<p><b>"+escapeHtml(f.q)+"</b><br>"+escapeHtml(f.a)+"</p>").join("");
    if(m.compareRows && m.compareRows.length){
      extra += "<table border=1 cellpadding=6 style='border-collapse:collapse;font-size:13px'><tr><th></th><th>This product</th><th>Typical alternatives</th></tr>" +
        m.compareRows.map(r=>"<tr><td><b>"+escapeHtml(r.label)+"</b></td><td>"+escapeHtml(r.this)+"</td><td>"+escapeHtml(r.typical)+"</td></tr>").join("") + "</table>";
    }
    return "<section style='margin-bottom:34px;padding-bottom:24px;border-bottom:1px solid #ddd'>" +
      "<div style='font:11px monospace;color:#888;text-transform:uppercase'>Module "+(i+1)+" — "+moduleTitle(m.type)+"</div>" +
      "<h2 style='font-family:Georgia,serif;margin:6px 0'>"+escapeHtml(m.headline||"")+"</h2>" +
      (m.subheadline? "<p style='font-weight:600;color:#444'>"+escapeHtml(m.subheadline)+"</p>" : "") +
      (img? "<img src='"+img+"' style='max-width:100%;border-radius:6px;margin:10px 0'>" : "") +
      (m.body? "<p>"+escapeHtml(m.body)+"</p>" : "") +
      extra +
      (m.mobileNote? "<div style='font:11px monospace;color:#999;margin-top:8px'>Mobile note: "+escapeHtml(m.mobileNote)+"</div>" : "") +
      "</section>";
  }).join("");
  return "<!doctype html><html><head><meta charset='utf-8'><title>A+ Content — "+escapeHtml(S.name)+"</title></head>" +
    "<body style='font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#222'>" +
    "<h1 style='font-family:Georgia,serif'>"+escapeHtml(S.name)+"</h1>" +
    "<p style='color:#666'>Brand: "+escapeHtml(S.brand||"—")+" · Generated with Shelfmark</p>" +
    "<div style='background:#f2f4ef;border:1px solid #d6dacf;border-radius:8px;padding:14px 16px;font-size:13px;margin:20px 0'>" +
    "Paste each module's headline/body/bullets into the matching Amazon A+ Content module in Seller Central, and upload the referenced photo. " +
    "Standard desktop modules run roughly 970×300–600px and Amazon serves the same modules responsively on mobile — always check current size guidance in the A+ Content Manager, since Amazon updates module specs periodically." +
    "</div>" + rows + "</body></html>";
}
function buildExportText(){
  return (S.modules||[]).map((m,i)=>{
    let out = "MODULE "+(i+1)+" — "+moduleTitle(m.type)+"\n";
    out += "Headline: "+(m.headline||"")+"\n";
    if(m.subheadline) out += "Subheadline: "+m.subheadline+"\n";
    if(m.body) out += "Body: "+m.body+"\n";
    if(m.bullets && m.bullets.length) out += "Bullets:\n" + m.bullets.map(b=>"  • "+b).join("\n") + "\n";
    if(m.faq && m.faq.length) out += m.faq.map(f=>"Q: "+f.q+"\nA: "+f.a).join("\n") + "\n";
    if(m.compareRows && m.compareRows.length) out += m.compareRows.map(r=>r.label+" — This: "+r.this+" | Typical: "+r.typical).join("\n") + "\n";
    if(m.imageIndex>=0 && S.images[m.imageIndex]) out += "Suggested photo: #"+(m.imageIndex+1)+" ("+S.images[m.imageIndex].name+")\n";
    return out;
  }).join("\n----------------------------\n\n");
}

async function downloadModuleImages(device){
  if(!downloadsApi){ toast("Downloads aren't available in this view."); return; }
  if(typeof html2canvas !== "function"){ toast("Image export library failed to load — try reloading the page."); return; }
  const width = device === "mobile" ? 390 : 970;
  const style = S.style || "cards";
  const modules = S.modules || [];
  if(!modules.length) return;
  const off = document.createElement("div");
  off.style.position = "fixed"; off.style.left = "-9999px"; off.style.top = "0"; off.style.width = width+"px";
  off.className = "device-frame " + device;
  off.innerHTML = renderModulesForStyle(modules, device, style);
  document.body.appendChild(off);
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  await new Promise(r=>setTimeout(r, 80));
  const items = off.querySelectorAll(".capture-item");
  let saved = 0;
  for(let i=0;i<items.length;i++){
    const m = modules[i];
    toast("Saving image "+(i+1)+" of "+items.length+"…");
    try{
      const canvas = await html2canvas(items[i], {backgroundColor:"#ffffff", scale:2});
      const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
      const fname = String(i+1).padStart(2,"0") + "-" + slug(moduleTitle(m.type)) + "-" + device + ".png";
      await downloadsApi.save({filename: fname, data: blob});
      saved++;
    }catch(e){
      if(e && e.code === "declined"){ break; }
      toast("Couldn't save image "+(i+1)+" — skipped.");
    }
  }
  document.body.removeChild(off);
  toast(saved ? "Done — "+saved+" of "+items.length+" images saved." : "Stopped.");
}

async function doDownload(kind){
  if(!downloadsApi){ toast("Downloads aren't available in this view."); return; }
  try{
    if(kind === "html"){
      await downloadsApi.save({filename:"aplus-content-"+slug(S.name)+".html", data: buildExportHtml()});
    }else{
      await downloadsApi.save({filename:"aplus-content-"+slug(S.name)+".txt", data: buildExportText()});
    }
    toast("Saved.");
  }catch(e){
    if(e && e.code === "declined") return;
    toast("Couldn't save the file — try again.");
  }
}

/* ============================= NAV HELPERS ============================= */
const STEP_ORDER = ["product","description","features","features-review","images","usage","concepts","preview"];
function stepLabel(s){
  return {product:"Product", description:"Description", features:"Features", "features-review":"Review features", images:"Photos",
    usage:"AI settings", concepts:"Concepts", generating:"Generating", preview:"Preview"}[s] || s;
}
function goto(step){ S.step = step; S.error=null; persistCurrent(); render(); window.scrollTo(0,0); }
function startNew(){
  S = newState(); S.id = uid(); S.step = "product"; render();
}
function resumeDraft(id){
  const rec = loadDrafts().find(d=>d.id===id);
  if(!rec) return;
  S = Object.assign(newState(), rec, {images: []});
  if(!S.modules && S.concepts && S.conceptId) S.step = "concepts";
  render();
  toast("Draft resumed — your photos didn't persist between visits, please re-add them.");
}

/* ============================= RENDER ============================= */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = topbar() + body();
  wireEvents();
}

function topbar(){
  return '<div class="topbar">' +
    '<div class="brand"><div class="brand-mark">🏷️</div><div><div class="brand-name">Shelfmark</div>' +
    '<div class="brand-sub">A+ CONTENT STUDIO</div></div></div>' +
    '<div class="topbar-actions">' +
      (S.step!=="home" ? '<button class="icon-btn" data-act="home">← All projects</button>' : '') +
    '</div></div>';
}

function body(){
  if(S.step === "home") return renderHome();
  if(S.step === "generating") return renderGenerating();
  return renderWizard();
}

function renderHome(){
  const drafts = loadDrafts();
  return '<div class="home-hero">' +
    '<div><div class="home-eyebrow">Amazon A+ Content</div>' +
    '<h1>Turn five photos and a few notes into shelf-ready A+ Content.</h1>' +
    '<p>Answer a handful of questions, drop in your product photos, pick from 3 AI-drafted design concepts, and get desktop- and mobile-optimized module copy ready to paste into Seller Central.</p>' +
    '<button class="btn btn-primary" data-act="create">Create <span style="opacity:.7">→</span></button></div>' +
    '<div class="create-ticket">' +
      '<div class="ticket-row"><span>Shelfmark</span><span>New Project</span></div>' +
      '<h2>What you\'ll do</h2>' +
      '<ul class="ticket-steps">' +
        '<li><span class="num">1</span><span><b>Tell us the basics</b> — product & brand name, description, features (or let AI draft them).</span></li>' +
        '<li><span class="num">2</span><span><b>Upload up to 5 photos</b> — hero, lifestyle, feature close-ups.</span></li>' +
        '<li><span class="num">3</span><span><b>Tune AI usage</b> — pick how much the AI analyzes & writes, so you don\'t burn credits you don\'t need.</span></li>' +
        '<li><span class="num">4</span><span><b>Pick 1 of 3 concepts</b>, review the desktop + mobile preview, and fix anything by just describing it.</span></li>' +
      '</ul>' +
      '<button class="btn btn-primary" data-act="create" style="width:100%; justify-content:center;">Create</button>' +
    '</div></div>' +
    '<div class="drafts-section"><div class="drafts-head"><h3>Saved projects</h3></div>' +
    (drafts.length ? '<div class="drafts-grid">' + drafts.map(d=>
      '<div class="draft-card" data-act="resume" data-id="'+d.id+'">' +
        '<button class="del" data-act="delete" data-id="'+d.id+'" title="Delete">✕</button>' +
        '<div class="stub">'+ (d.step==="preview"?"Ready":"In progress") +'</div>' +
        '<div class="title">'+escapeHtml(d.name || "Untitled product")+'</div>' +
        '<div class="meta">'+new Date(d.updatedAt).toLocaleDateString()+' · '+stepLabel(d.step)+'</div>' +
      '</div>').join('') + '</div>'
      : '<div class="empty-note">No projects yet — click Create to start your first one.</div>') +
    '</div>';
}

function renderGenerating(){
  return '<div class="wizard"><div class="panel" style="grid-column:1/-1">' +
    '<div class="think-box">' +
      '<div class="spinner"></div>' +
      '<div class="msg">'+escapeHtml(S.genMsg)+'</div>' +
      (S.genStream ? '<div class="stream">'+escapeHtml(S.genStream)+'…</div>' : '') +
    '</div></div></div>';
}

function railHtml(){
  const idx = STEP_ORDER.indexOf(S.step);
  return '<div class="rail"><div class="rail-title">Project</div><ul class="rail-steps">' +
    STEP_ORDER.map((s,i)=>{
      const cls = i===idx ? "active" : (i<idx ? "done" : "");
      return '<li class="rail-step '+cls+'"><span class="rail-dot"></span>'+stepLabel(s)+'</li>';
    }).join('') + '</ul></div>';
}

function panelFoot(back, nextLabel, nextAct, nextDisabled){
  return '<div class="panel-foot">' +
    (back ? '<button class="btn btn-ghost" data-act="'+back+'">← Back</button>' : '<span></span>') +
    '<button class="btn btn-primary" data-act="'+nextAct+'" '+(nextDisabled?'disabled':'')+'>'+nextLabel+'</button>' +
    '</div>';
}

function renderWizard(){
  return '<div class="wizard">' + railHtml() + '<div class="panel">' +
    (S.error ? '<div class="error-banner">'+escapeHtml(S.error)+'</div>' : '') +
    ({
      product: renderProductStep,
      description: renderDescriptionStep,
      features: renderFeaturesStep,
      "features-review": renderFeaturesReviewStep,
      images: renderImagesStep,
      usage: renderUsageStep,
      concepts: renderConceptsStep,
      preview: renderPreviewStep
    }[S.step] || renderProductStep)() +
    '</div></div>';
}

function renderProductStep(){
  return '<div class="panel-head"><div class="panel-eyebrow">Step 1 of 8</div><h2>What are we creating content for?</h2>' +
    '<p>Start with the name customers will search for, and your brand if you have one.</p></div>' +
    '<div class="panel-body">' +
    '<label class="field"><span class="lbl">Product name</span>' +
    '<input type="text" id="f-name" value="'+escapeHtml(S.name)+'" placeholder="e.g. Ceramic Pour-Over Coffee Dripper"></label>' +
    '<label class="field"><span class="lbl">Brand name <span class="skip">optional</span></span>' +
    '<input type="text" id="f-brand" value="'+escapeHtml(S.brand)+'" placeholder="e.g. Northfield Home"></label>' +
    '</div>' + panelFoot(null, "Continue", "next-product");
}

function renderDescriptionStep(){
  return '<div class="panel-head"><div class="panel-eyebrow">Step 2 of 8</div><h2>Describe the product</h2>' +
    '<p>A couple of sentences is enough — what it is, who it\'s for, and the main problem it solves. The AI will expand this into full copy later.</p></div>' +
    '<div class="panel-body">' +
    '<label class="field"><span class="lbl">Product description</span>' +
    '<textarea id="f-desc" placeholder="e.g. A hand-thrown ceramic pour-over dripper that keeps coffee hotter for longer thanks to double-wall insulation. Fits standard filters, dishwasher safe, made for people who want café-quality coffee without the counter clutter of an electric machine.">'+escapeHtml(S.description)+'</textarea></label>' +
    '</div>' + panelFoot("prev-images-back-to-product","Continue","next-description", false);
}

function renderFeaturesStep(){
  return '<div class="panel-head"><div class="panel-eyebrow">Step 3 of 8</div><h2>Key features & benefits</h2>' +
    '<p>List them one per line, or skip and the AI will draft a conservative set from your description — either way you\'ll get to approve or drop each one next.</p></div>' +
    '<div class="panel-body">' +
    '<label class="field"><span class="lbl">Features <span class="skip">optional — skip to auto-generate</span></span>' +
    '<textarea id="f-features" placeholder="Double-wall stoneware, keeps coffee hot 45+ min\nFits size 2 paper filters\nDishwasher and microwave safe\nHolds up to 3 cups">'+escapeHtml(S.features)+'</textarea></label>' +
    '</div>' + panelFoot("prev-description","Continue","next-features");
}

function renderFeaturesReviewStep(){
  const cands = S.featureCandidates || [];
  return '<div class="panel-head"><div class="panel-eyebrow">Step 4 of 8</div><h2>Confirm which features to show</h2>' +
    '<p>'+(S.featuresSkipped ? "The AI drafted these from your description — uncheck anything that\'s not right." : "Uncheck anything you don\'t want included in the final content.")+'</p></div>' +
    '<div class="panel-body">' +
    (cands.length ? '<div class="check-list">' + cands.map((c,i)=>
      '<label class="check-row"><input type="checkbox" data-act="toggle-feature" data-i="'+i+'" '+(c.approved?'checked':'')+'><span>'+escapeHtml(c.text)+'</span></label>'
    ).join('') + '</div>' : '<div class="empty-note">No features yet — add one below.</div>') +
    '<div class="add-row"><input type="text" id="f-add-feature" placeholder="Add another feature…">' +
    '<button class="btn btn-ghost btn-sm" data-act="add-feature">Add</button></div>' +
    (S.featuresSkipped ? '<div style="margin-top:14px"><button class="btn btn-ghost btn-sm" data-act="regen-features">↻ Regenerate suggestions</button></div>' : '') +
    '</div>' + panelFoot("prev-features-review","Continue","next-features-review", !cands.some(c=>c.approved));
}

function renderImagesStep(){
  const thumbs = S.images.map((im,i)=>
    '<div class="thumb"><span class="idx">#'+(i+1)+'</span><button class="rm" data-act="rm-image" data-i="'+i+'">✕</button>' +
    '<img src="'+im.dataUrl+'">' +
    '<div class="role"><select data-act="role-image" data-i="'+i+'">' +
      ROLE_OPTS.map(r=>'<option value="'+r[0]+'" '+(r[0]===im.role?'selected':'')+'>'+r[1]+'</option>').join('') +
    '</select></div></div>').join('');
  return '<div class="panel-head"><div class="panel-eyebrow">Step 5 of 8</div><h2>Upload product photos</h2>' +
    '<p>Up to 5. A clean hero shot and one lifestyle/in-use photo cover the essentials — add more for feature close-ups or contents. Nothing leaves your browser — no upload to any server.</p></div>' +
    '<div class="panel-body">' +
    '<div class="upload-zone" id="dropzone"><input type="file" id="f-file" accept="image/*" multiple hidden>' +
      '<div class="u-icon">📷</div><div class="u-title">Drop photos here or click to browse</div>' +
      '<div class="u-sub">'+S.images.length+' / 5 added · JPG or PNG</div></div>' +
    (thumbs ? '<div class="thumbs">'+thumbs+'</div>' : '') +
    '</div>' + panelFoot("prev-features","Continue","next-images", S.images.length<1);
}

function renderUsageStep(){
  const maxUse = Math.max(1, S.images.length);
  const useOpts = [2,3,4,5].filter(n=>n<=maxUse);
  if(!useOpts.length) useOpts.push(maxUse);
  const rec = Math.min(4, maxUse);
  const visionOpts = [
    [0,"None","AI writes from your text only — fastest, cheapest."],
    [1,"Light","Sends 1 photo for grounding."],
    [2,"Standard","Sends 2 photos (hero + lifestyle). Recommended."],
    [3,"Thorough","Sends 3 photos — slower & pricier per call."]
  ].filter(o=>o[0] <= Math.min(3, S.images.length));
  const canVision = sampleLimits && sampleLimits.images;
  return '<div class="panel-head"><div class="panel-eyebrow">Step 6 of 8</div><h2>Tune AI usage</h2>' +
    '<p>Every generation spends your own Claude usage — these settings control how much each call costs, so you don\'t burn credits on more than you need.</p></div>' +
    '<div class="panel-body">' +
    '<label class="field"><span class="lbl">Photos to use in the design</span></label>' +
    '<div class="opt-grid" style="margin-bottom:24px">' +
      useOpts.map(n=>'<div class="opt-card '+(S.imagesToUse===n?'selected':'')+'" data-act="pick-imgcount" data-n="'+n+'">' +
        (n===rec?'<span class="rec">Recommended</span>':'') +
        '<div class="t">'+n+' photo'+(n>1?'s':'')+'</div>' +
        '<div class="d">Uses your first '+n+' photo'+(n>1?'s':'')+' (by role order).</div>' +
      '</div>').join('') +
    '</div>' +
    (canVision ? (
    '<label class="field"><span class="lbl">AI photo analysis</span></label>' +
    '<div class="opt-grid" style="margin-bottom:24px">' +
      visionOpts.map(o=>'<div class="opt-card '+(S.visionCount===o[0]?'selected':'')+'" data-act="pick-vision" data-n="'+o[0]+'">' +
        (o[0]===2?'<span class="rec">Recommended</span>':'') +
        '<div class="t">'+o[1]+'</div><div class="d">'+o[2]+'</div>' +
        '<div class="cost">'+(o[0]===0?'⚡ text-only':'🖼 +'+o[0]+' image'+(o[0]>1?'s':''))+' per call</div>' +
      '</div>').join('') +
    '</div>') : '') +
    '<label class="field"><span class="lbl">Design depth</span></label>' +
    '<div class="opt-grid">' +
      Object.keys(DEPTHS).map(k=>{const d=DEPTHS[k]; return '<div class="opt-card '+(S.depth===k?'selected':'')+'" data-act="pick-depth" data-k="'+k+'">' +
        (k==="standard"?'<span class="rec">Recommended</span>':'') +
        '<div class="t">'+d.label+'</div><div class="d">'+d.desc+'</div>' +
        '<div class="cost">~'+d.modules+' modules · '+d.tier+' tier</div>' +
      '</div>';}).join('') +
    '</div>' +
    '</div>' + panelFoot("prev-images", "Generate 3 concepts", "go-concepts");
}

function renderConceptsStep(){
  if(!S.concepts) return renderUsageStep();
  return '<div class="panel-head"><div class="panel-eyebrow">Step 7 of 8</div><h2>Pick a design concept</h2>' +
    '<p>Three different strategic angles for the same product. Pick one, or regenerate for 3 new ones (spends another AI call).</p></div>' +
    '<div class="panel-body">' +
    '<div class="concept-grid">' +
      S.concepts.map(c=>'<div class="concept-card '+(S.conceptId===c.id?'selected':'')+'" data-act="pick-concept" data-id="'+c.id+'">' +
        (c.recommended?'<span class="badge">Best fit</span>':'') +
        '<h4>'+escapeHtml(c.name)+'</h4><div class="pitch">'+escapeHtml(c.pitch)+'</div>' +
        '<div class="concept-flow">'+(c.moduleFlow||[]).map(m=>'<span class="flow-chip">'+escapeHtml(m.label||m.type)+'</span>').join('')+'</div>' +
        '<div class="why">'+escapeHtml(c.why||"")+'</div>' +
      '</div>').join('') +
    '</div>' +
    '<div style="margin-top:16px"><button class="btn btn-ghost btn-sm" data-act="regen-concepts">↻ Regenerate 3 concepts</button></div>' +
    '</div>' + panelFoot("prev-usage", "Generate full content", "go-generate", !S.conceptId);
}

function moduleInner(m, device, style){
  let media = "";
  if(m.imageIndex>=0 && S.images[m.imageIndex]){
    const badges = (style==="callouts" && m.bullets && m.bullets.length)
      ? m.bullets.slice(0,5).map((b,bi)=>{
          const pos = CALLOUT_POS[bi % CALLOUT_POS.length];
          return '<span class="callout-badge" style="top:'+pos.top+';left:'+pos.left+'">'+(bi+1)+'</span>';
        }).join('')
      : "";
    media = '<div class="mod-media callout-media"><img src="'+S.images[m.imageIndex].dataUrl+'">'+badges+'</div>';
  }
  let inner = "";
  if(m.type === "comparison" && m.compareRows && m.compareRows.length){
    inner = '<div class="mod-compare"><table><tr><th></th><th>This product</th><th>Typical alternatives</th></tr>' +
      m.compareRows.map(r=>'<tr><td><b>'+escapeHtml(r.label)+'</b></td><td>'+escapeHtml(r.this)+'</td><td>'+escapeHtml(r.typical)+'</td></tr>').join('') +
      '</table></div>';
  } else if(m.type === "faq" && m.faq && m.faq.length){
    inner = '<div class="mod-faq">'+m.faq.map(f=>'<div class="qa"><div class="q">'+escapeHtml(f.q)+'</div><div class="a">'+escapeHtml(f.a)+'</div></div>').join('')+'</div>';
  } else if(m.bullets && m.bullets.length){
    if(style==="callouts"){
      inner = '<ol class="callout-list">'+m.bullets.map((b,bi)=>'<li><span class="callout-num">'+(bi+1)+'</span>'+escapeHtml(b)+'</li>').join('')+'</ol>';
    } else if(m.type==="feature_bullets" && (style==="cards"||style==="bento") && m.bullets.length>=3){
      inner = '<div class="chiplet-grid">'+m.bullets.map(b=>'<div class="chiplet">'+escapeHtml(b)+'</div>').join('')+'</div>';
    } else {
      inner = '<ul class="bullets">'+m.bullets.map(b=>'<li>'+escapeHtml(b)+'</li>').join('')+'</ul>';
    }
  }
  const hasSideBySide = media && inner && m.type !== "comparison" && m.type !== "faq";
  const body = (m.body ? '<div class="body-txt">'+escapeHtml(m.body)+'</div>' : '');
  const content = hasSideBySide
    ? '<div class="mod-grid">'+media+'<div>'+body+inner+'</div></div>'
    : (media + body + inner);
  return '<div class="mod-eyebrow">'+escapeHtml(moduleTitle(m.type))+'</div>' +
    '<h3>'+escapeHtml(m.headline||"")+'</h3>' +
    (m.subheadline ? '<div class="sub">'+escapeHtml(m.subheadline)+'</div>' : '') +
    content +
    (device==="mobile" && m.mobileNote ? '<div class="mobile-note">📱 '+escapeHtml(m.mobileNote)+'</div>' : '');
}

const WAVE_SVG = '<div class="wave-divider"><svg viewBox="0 0 400 26" preserveAspectRatio="none"><path d="M0,13 Q50,26 100,13 T200,13 T300,13 T400,13 V26 H0 Z" fill="#EEF0EA"></path></svg></div>';

function renderModulesForStyle(modules, device, style){
  const n = modules.length;
  if(style === "bento"){
    return '<div class="bento-grid">' + modules.map((m,i)=>{
      const span = (m.type==="hero") ? "span-4" : (m.type==="comparison"||m.type==="faq") ? "span-2" : "";
      return '<div class="mod-card tint-'+(i%5)+' '+span+' capture-item" data-idx="'+i+'"><span class="tagno">'+(i+1)+'/'+n+'</span><div class="mod">'+moduleInner(m,device,style)+'</div></div>';
    }).join('') + '</div>';
  }
  if(style === "cards" || style === "callouts"){
    return '<div class="mod-card-wrap">' + modules.map((m,i)=>
      '<div class="mod-card tint-'+(i%5)+' capture-item" data-idx="'+i+'"><span class="tagno">'+(i+1)+'/'+n+'</span><div class="mod">'+moduleInner(m,device,style)+'</div></div>'
    ).join('') + '</div>';
  }
  return modules.map((m,i)=>'<div class="mod capture-item" data-idx="'+i+'">'+moduleInner(m,device,style)+(i<n-1?WAVE_SVG:'')+'</div>').join('');
}

function renderPreviewStep(){
  const device = S.previewDevice || "desktop";
  const style = S.style || "cards";
  const modsHtml = renderModulesForStyle(S.modules||[], device, style);
  const frame = '<div class="device-frame '+device+'" id="captureFrame">'+modsHtml+'</div>';
  const modPills = (S.modules||[]).map(m=>
    '<span class="mod-pill '+(S.feedbackTargets.indexOf(m.type)>=0?'on':'')+'" data-act="toggle-fb-target" data-t="'+m.type+'">'+escapeHtml(moduleTitle(m.type))+'</span>'
  ).join('');
  return '<div class="panel-head"><div class="panel-eyebrow">Step 8 of 8</div><h2>Preview & export</h2>' +
    '<p>Same content, different skins — switching style or device costs nothing, no new AI call. Everything renders live in your browser; nothing is uploaded anywhere.</p></div>' +
    '<div class="panel-body">' +
    '<div class="preview-toolbar">' +
      '<div class="style-tabs">' + Object.keys(STYLES).map(k=>
        '<button class="'+(style===k?"active":"")+'" data-act="set-style" data-s="'+k+'" title="'+escapeHtml(STYLES[k].desc)+'">'+escapeHtml(STYLES[k].label)+'</button>'
      ).join('') + '</div>' +
      '<div class="device-tabs">' +
        '<button class="'+(device==="desktop"?"active":"")+'" data-act="set-device" data-d="desktop">🖥 Desktop</button>' +
        '<button class="'+(device==="mobile"?"active":"")+'" data-act="set-device" data-d="mobile">📱 Mobile</button>' +
      '</div>' +
    '</div>' +
    '<div class="device-stage">'+(device==="mobile" ? '<div class="phone-chrome"><div class="notch"></div>'+frame+'</div>' : frame)+'</div>' +
    '<div class="spec-note"><b>Exporting:</b> Amazon builds A+ Content module-by-module in Seller Central, not from one HTML upload — so the main export saves each module as its own numbered image (01, 02, 03…) for the device you\'re viewing, ready to drop into the matching module slot. A reference doc and plain-text copy are also available.</div>' +
    '<div class="export-bar">' +
      '<button class="btn btn-tag" data-act="download-images">⬇ Download images, in order ('+device+')</button>' +
      '<button class="btn btn-ghost" data-act="download-html">⬇ Reference doc (.html)</button>' +
      '<button class="btn btn-ghost" data-act="download-txt">⬇ Copy only (.txt)</button>' +
    '</div>' +
    '<div class="privacy-note">🔒 Runs entirely in this browser tab — nothing is saved to a server.</div>' +
    '<div class="feedback-box"><h4>Something wrong? Describe it and I\'ll fix it.</h4>' +
      '<div class="mod-picker">'+modPills+'</div>' +
      '<textarea id="f-feedback" placeholder="e.g. The hero headline is too generic, make it mention the double-wall insulation. Or leave module selection empty to revise everything.">'+escapeHtml(S.feedbackText)+'</textarea>' +
      '<div style="margin-top:10px"><button class="btn btn-primary btn-sm" data-act="apply-feedback">Apply fix</button></div>' +
    '</div>' +
    '</div>' + panelFoot("prev-concepts-from-preview", "Start a new project", "new-project");
}

/* ============================= EVENTS ============================= */
function wireEvents(){
  const app = document.getElementById("app");
  app.onclick = async (e)=>{
    const t = e.target.closest("[data-act]");
    if(!t) return;
    const act = t.getAttribute("data-act");
    if(act==="home"){ persistCurrent(); S.step="home"; render(); return; }
    if(act==="create"){ startNew(); return; }
    if(act==="resume"){ resumeDraft(t.getAttribute("data-id")); return; }
    if(act==="delete"){ e.stopPropagation(); deleteDraft(t.getAttribute("data-id")); render(); return; }
    if(act==="new-project"){ startNew(); return; }

    if(act==="next-product"){
      S.name = document.getElementById("f-name").value.trim();
      S.brand = document.getElementById("f-brand").value.trim();
      if(!S.name){ toast("Give your product a name to continue."); return; }
      goto("description"); return;
    }
    if(act==="next-description"){
      S.description = document.getElementById("f-desc").value.trim();
      if(!S.description){ toast("A short description helps the AI a lot — please add one."); return; }
      goto("features"); return;
    }
    if(act==="next-features"){
      S.features = document.getElementById("f-features").value.trim();
      if(S.features){
        S.featuresSkipped = false;
        S.featureCandidates = buildCandidatesFromTyped(S.features);
        goto("features-review");
      } else {
        await generateFeatureCandidates();
      }
      return;
    }
    if(act==="prev-features-review"){ goto("features"); return; }
    if(act==="next-features-review"){
      if(!(S.featureCandidates||[]).some(c=>c.approved)){ toast("Approve at least one feature, or add one."); return; }
      goto("images"); return;
    }
    if(act==="add-feature"){
      const val = document.getElementById("f-add-feature").value.trim();
      if(val){ S.featureCandidates.push({text:val, approved:true}); }
      render(); return;
    }
    if(act==="regen-features"){ await generateFeatureCandidates(); return; }
    if(act==="next-images"){ goto("usage"); return; }
    if(act==="rm-image"){ S.images.splice(+t.getAttribute("data-i"),1); render(); return; }
    if(act==="prev-images-back-to-product"){ goto("product"); return; }
    if(act==="prev-description"){ S.description = document.getElementById("f-desc")?document.getElementById("f-desc").value.trim():S.description; goto("product"); return; }
    if(act==="prev-features"){ goto("features-review"); return; }
    if(act==="prev-images"){ goto("images"); return; }
    if(act==="prev-usage"){ goto("usage"); return; }
    if(act==="prev-concepts-from-preview"){ goto("concepts"); return; }
    if(act==="set-style"){ S.style = t.getAttribute("data-s"); render(); return; }
    if(act==="download-images"){ await downloadModuleImages(S.previewDevice||"desktop"); return; }

    if(act==="pick-imgcount"){ S.imagesToUse = +t.getAttribute("data-n"); render(); return; }
    if(act==="pick-vision"){ S.visionCount = +t.getAttribute("data-n"); render(); return; }
    if(act==="pick-depth"){ S.depth = t.getAttribute("data-k"); render(); return; }
    if(act==="go-concepts"){ await generateConcepts(); return; }
    if(act==="pick-concept"){ S.conceptId = t.getAttribute("data-id"); render(); return; }
    if(act==="regen-concepts"){ await generateConcepts(); return; }
    if(act==="go-generate"){ await generateFullContent(); return; }

    if(act==="set-device"){ S.previewDevice = t.getAttribute("data-d"); render(); return; }
    if(act==="toggle-fb-target"){
      const ty = t.getAttribute("data-t");
      const i = S.feedbackTargets.indexOf(ty);
      if(i>=0) S.feedbackTargets.splice(i,1); else S.feedbackTargets.push(ty);
      render(); return;
    }
    if(act==="apply-feedback"){
      S.feedbackText = document.getElementById("f-feedback").value;
      await applyFeedback(); return;
    }
    if(act==="download-html"){ await doDownload("html"); return; }
    if(act==="download-txt"){ await doDownload("txt"); return; }
  };
  app.onchange = (e)=>{
    const t = e.target;
    if(t.id === "f-file"){ handleFiles(t.files); t.value=""; return; }
    if(t.matches("[data-act=role-image]")){ S.images[+t.getAttribute("data-i")].role = t.value; return; }
    if(t.matches("[data-act=toggle-feature]")){ S.featureCandidates[+t.getAttribute("data-i")].approved = t.checked; return; }
  };
  const dz = document.getElementById("dropzone");
  if(dz){
    dz.onclick = ()=> document.getElementById("f-file").click();
    dz.ondragover = (e)=>{ e.preventDefault(); dz.classList.add("drag"); };
    dz.ondragleave = ()=> dz.classList.remove("drag");
    dz.ondrop = (e)=>{ e.preventDefault(); dz.classList.remove("drag"); handleFiles(e.dataTransfer.files); };
  }
}

render();
initCapabilities();
})();
</script>
