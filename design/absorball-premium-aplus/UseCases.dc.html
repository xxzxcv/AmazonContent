<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --navy:#16234F; --navy2:#22346A; --sky:#6E9FCB; --sky-light:#DCE9F5;
      --paper:#FAFAF8; --ink:#12182B; --ink-muted:#4B5670; --line:#D8DEE8; --amber:#E8A33D;
    }
    body{ margin:0; font-family:'IBM Plex Sans', system-ui, sans-serif; }
    h1,h2,h3{ font-family:'Sora', system-ui, sans-serif; margin:0; }
  </style>
</helmet>
<div style="width:1464px;height:600px;position:relative;overflow:hidden;background:var(--paper);box-sizing:border-box;padding:48px 60px 56px;display:flex;flex-direction:column;gap:22px;">
  <div>
    <div style="font-family:'IBM Plex Sans';font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);">Where It Works Best</div>
    <h2 style="font-size:34px;font-weight:800;color:var(--navy);">Built for every demanding space</h2>
  </div>
  <div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;">
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="flex:1;border-radius:12px;overflow:hidden;box-shadow:0 14px 28px rgba(22,35,79,.14);"><img src="usecase-kitchen.jpg" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
      <div style="font-weight:600;color:var(--navy);font-size:15px;">Commercial kitchens</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="flex:1;border-radius:12px;overflow:hidden;box-shadow:0 14px 28px rgba(22,35,79,.14);"><img src="usecase-garage.jpg" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
      <div style="font-weight:600;color:var(--navy);font-size:15px;">Workshops &amp; garages</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="flex:1;border-radius:12px;overflow:hidden;box-shadow:0 14px 28px rgba(22,35,79,.14);"><img src="usecase-clinical.jpg" style="width:100%;height:100%;object-fit:cover;display:block;"></div>
      <div style="font-weight:600;color:var(--navy);font-size:15px;">Clinical &amp; medical settings</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
