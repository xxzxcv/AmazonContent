<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --navy:#16234F; --navy2:#22346A; --sky:#6E9FCB; --sky-light:#DCE9F5;
      --paper:#FAFAF8; --ink:#12182B; --ink-muted:#4B5670; --line:#D8DEE8; --amber:#E8A33D;
    }
    body{ margin:0; font-family:'IBM Plex Sans', system-ui, sans-serif; }
    h1,h2,h3{ font-family:'Sora', system-ui, sans-serif; margin:0; }
    .tick{ width:26px; height:1px; background:var(--sky); flex:none; }
  </style>
</helmet>
<div style="width:1464px;height:600px;position:relative;overflow:hidden;background:var(--paper);box-sizing:border-box;padding:52px 60px;display:flex;flex-direction:column;gap:8px;">
  <div style="font-family:'IBM Plex Sans';font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);">Built To Perform</div>
  <h2 style="font-size:34px;font-weight:800;color:var(--navy);margin-bottom:18px;">What makes it built for the job</h2>
  <div style="flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:36px;align-items:center;">
    <div style="display:flex;flex-direction:column;gap:34px;align-items:flex-end;text-align:right;">
      <div style="display:flex;flex-direction:row-reverse;align-items:center;gap:12px;"><span class="tick"></span><span style="font-size:15px;color:var(--ink);max-width:22ch;">Deep embossing traps mess instead of pushing it around</span></div>
      <div style="display:flex;flex-direction:row-reverse;align-items:center;gap:12px;"><span class="tick"></span><span style="font-size:15px;color:var(--ink);max-width:22ch;">2-ply structure resists tearing under pressure</span></div>
    </div>
    <div style="width:300px;border-radius:14px;overflow:hidden;box-shadow:0 22px 42px rgba(22,35,79,.2);">
      <img src="texture-closeup.jpg" style="width:100%;display:block;">
    </div>
    <div style="display:flex;flex-direction:column;gap:34px;align-items:flex-start;text-align:left;">
      <div style="display:flex;align-items:center;gap:12px;"><span class="tick"></span><span style="font-size:15px;color:var(--ink);max-width:22ch;">Soft-touch surface that's still tough on grime</span></div>
      <div style="display:flex;align-items:center;gap:12px;"><span class="tick"></span><span style="font-size:15px;color:var(--ink);max-width:22ch;">Consistent quality, roll after roll</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
