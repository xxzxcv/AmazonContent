  <style>
    :root{
      --navy:#16234F; --navy2:#22346A; --sky:#6E9FCB; --sky-light:#DCE9F5;
      --paper:#FAFAF8; --ink:#12182B; --ink-muted:#4B5670; --line:#D8DEE8; --amber:#E8A33D;
    }
    body{ margin:0; font-family:'IBM Plex Sans', system-ui, sans-serif; }
    a{ color:var(--amber); } a:hover{ color:#C9862B; }

<div style="width:1464px;height:600px;position:relative;overflow:hidden;background:var(--paper);display:flex;">
  <div style="width:58%;height:100%;background:linear-gradient(155deg,var(--navy) 0%,var(--navy2) 100%);display:flex;flex-direction:column;justify-content:center;padding:64px 56px;box-sizing:border-box;gap:22px;">
    <div style="font-family:'IBM Plex Sans';font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);">Value Plus &middot; Highly Absorbent Centrefeed Rolls</div>
    <h1 style="font-size:56px;font-weight:800;color:#fff;line-height:1.05;text-wrap:balance;">Professional-grade<br>clean-up, pack of 6.</h1>
    <div style="font-size:19px;color:#DCE4F2;max-width:46ch;line-height:1.5;">Highly absorbent blue centrefeed rolls, embossed for extra strength &mdash; built for kitchens, workshops, and clinical spaces that can't stop for a mess.</div>
    <div style="display:flex;gap:14px;margin-top:6px;">
      <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;font-weight:600;">6 Rolls / 2-Ply</div>
      <div style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;font-weight:600;">DWCF01</div>
    </div>
  </div>
  <div style="width:42%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--sky-light);position:relative;">
    <div style="position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#ffffff 0%, var(--sky-light) 70%);"></div>
    <img src="pack-hero.jpg" style="position:relative;width:78%;object-fit:contain;filter:drop-shadow(0 24px 28px rgba(22,35,79,.28));">
  </div>
</div>
